<body>
    <header>
        <nav>
            <a href="../index.html"><img src="../images/MOVE.png" class="logo" alt="move-logo"></a>

    </header>
    <main>
    <h1>Create post</h1>

    <form id="create-post">
        <label for="title">Title</label>
        <textarea id="title" name="title" class="formfields"></textarea>
        <label for="body">Text</label>
        <textarea id="body" name="body" class="formfields"></textarea>
        <label for="url">Image URL</label>
        <textarea id="url" name="url" class="formfields"></textarea>
        <label for="alt">Image ALT</label>
        <textarea id="alt" name="alt" class="formfields"></textarea>
        <button class="create-btn">Create</button>
    </form>
</main>
