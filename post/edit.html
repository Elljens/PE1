    <h1>Edit post</h1>
<div id="edit-page">
    <form id="edit-form">
        <label for="title">Title</label>
        <textarea id="title" name="title" class="formfields"></textarea>
        <label for="body">Text</label>
        <textarea id="body" name="body" class="formfields"></textarea>
        <label for="url">Image URL</label>
        <textarea id="url" name="url" type="url" class="formfields"></textarea>
        <label for="alt">Image ALT</label>
        <textarea id="alt" name="alt" class="formfields"></textarea>
        <div class="edit-buttons">
        <button id="submit">Update post</button>
        <button id="delete-button">Delete post</button>
        </div>
    </form>
</div>
